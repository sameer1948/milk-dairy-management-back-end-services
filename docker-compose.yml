version: "3.8"

services:

  mysql:
    image: mysql:8.0
    container_name: milk_mysql
    restart: always
    environment:
      MYSQL_DATABASE: milk_dairy_db
      MYSQL_USER: ahsuna
      MYSQL_PASSWORD: Sameer
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  app:
    build: .
    container_name: milk_app
    restart: always
    depends_on:
      - mysql
    ports:
      - "8799:8799"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/milk_dairy_db
      SPRING_DATASOURCE_USERNAME: ahsuna
      SPRING_DATASOURCE_PASSWORD: Sameer

volumes:
  mysql_data: